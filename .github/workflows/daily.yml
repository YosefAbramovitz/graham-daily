name: Daily Graham screen
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the Graham screen
        run: python graham_screener.py --universe sp500 --mode defensive --out results.csv --sleep 0.15
      - name: Build the web page
        run: python build_page.py --in results.csv --out docs/index.html
      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.csv docs/index.html
          git diff --staged --quiet || git commit -m "Daily Graham screen"
          git push || echo "nothing to push"
          python-version: "3.11"
