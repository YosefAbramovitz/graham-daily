name: Daily Graham screen

on:
  schedule:
    # 21:30 UTC, ראשון עד חמישי = אחרי נעילת המסחר בניו יורק
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "רשימת טיקרים לבדיקה מהירה, מופרדת בפסיקים. ריק = סריקה מלאה. ריצת בדיקה אינה נשמרת במאגר."
        required: false
        default: ""
      universe:
        description: "היקום לסריקה מלאה"
        required: false
        default: "sp1500"
        type: choice
        options: ["sp1500", "sp500"]
      list_only:
        description: "רק לבדוק שרשימות המדדים נמשכות, בלי לסרוק"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-graham
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check the index constituent lists
        if: ${{ inputs.list_only == true }}
        env:
          UNIVERSE: ${{ inputs.universe || 'sp1500' }}
        run: python graham_screener.py --universe "$UNIVERSE" --list-only

      - name: Run the Graham screen
        if: ${{ inputs.list_only != true }}
        env:
          TICKERS: ${{ inputs.tickers }}
          UNIVERSE: ${{ inputs.universe || 'sp1500' }}
          # ה-SEC דורשת כתובת יצירת קשר בכותרת הבקשה. מוגדרת כסוד במאגר,
          # כדי שכתובת פרטית לא תשב בקוד פתוח.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'graham-daily screener' }}
        run: |
          if [ -n "$TICKERS" ]; then
            echo "Test run over: $TICKERS"
            python graham_screener.py --tickers "$TICKERS" --out results.csv --sleep 0.15
          else
            python graham_screener.py --universe "$UNIVERSE" --out results.csv --sleep 0.15
          fi

      - name: Build both web pages
        if: ${{ inputs.list_only != true }}
        run: |
          python build_page.py --in results.csv --out docs/index.html --mode defensive
          python build_page.py --in results.csv --out docs/enterprising.html --mode enterprising

      - name: Commit and push results
        if: ${{ inputs.tickers == '' && inputs.list_only != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.csv docs/index.html docs/enterprising.html
          if git diff --staged --quiet; then
            echo "אין שינוי, אין מה לשמור"
            exit 0
          fi
          git commit -m "Daily Graham screen"
          # דחיפה עם ניסיונות חוזרים. בלי זה, commit שנוחת במאגר בזמן שהסריקה
          # רצה דוחה את הדחיפה, והתוצאה של ריצה שלמה נעלמת בלי שאיש ישים לב.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "נשמר בניסיון $attempt"
              exit 0
            fi
            echo "ניסיון $attempt נכשל, מנסה שוב"
            sleep 5
          done
          echo "לא הצלחתי לדחוף אחרי שלושה ניסיונות" >&2
          exit 1
