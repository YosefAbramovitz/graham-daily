name: Daily technical stage

on:
  schedule:
    # 08:00 בישראל, בכל בוקר של יום מסחר. שתי השעות מכסות שעון קיץ ושעון חורף,
    # והצעד הראשון בעבודה מוודא שרק אחת מהן באמת ממשיכה.
    - cron: "0 5 * * 2-6"
    - cron: "0 6 * * 2-6"
  workflow_dispatch:
    inputs:
      tickers:
        description: "רשימת טיקרים לבדיקה מהירה, מופרדת בפסיקים. ריק = כל עוברי גראהם. ריצת בדיקה אינה נשמרת במאגר."
        required: false
        default: ""
      mode:
        description: "אילו עוברי גראהם לקחת"
        required: false
        default: "both"
        type: choice
        options: ["both", "defensive", "enterprising"]

permissions:
  contents: write

concurrency:
  group: daily-technical
  cancel-in-progress: false

jobs:
  technical:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # GitHub מתחיל ריצות מתוזמנות באיחור של עד כמה שעות, ולכן הבדיקה אינה
      # "האם עכשיו 08:00" (אז כמעט כל ריצה מדלגת) אלא "האם כבר 08:00 או אחרי,
      # והשלב עוד לא רץ היום". שני ה-cron מבטיחים ריצה אחת בבוקר, קיץ וחורף.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Has today's run happened yet
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          today=$(TZ=Asia/Jerusalem date +%F)
          hour=$(TZ=Asia/Jerusalem date +%-H)
          last=$(TZ=Asia/Jerusalem git log -1 --date=format-local:%F --format=%cd \
                 --grep="Daily technical stage" -- docs/technical.html)
          echo "Israel: $today ${hour}h, last technical commit: ${last:-none}"
          if [ "$hour" -ge 8 ] && [ "$last" != "$today" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Run the quality stage
        if: steps.gate.outputs.go == 'true'
        env:
          TICKERS: ${{ inputs.tickers }}
          MODE: ${{ inputs.mode || 'both' }}
        run: |
          if [ -n "$TICKERS" ]; then
            echo "Test run over: $TICKERS"
            python quality_screener.py --tickers "$TICKERS" --out quality_results.csv --sleep 0.2
          else
            python quality_screener.py --in results.csv --mode "$MODE" --out quality_results.csv --sleep 0.2
          fi

      - name: Run the technical stage
        if: steps.gate.outputs.go == 'true'
        env:
          MODE: ${{ inputs.mode || 'both' }}
        run: python tech_screener.py --in quality_results.csv --mode "$MODE" --out tech_results.csv --sleep 0.15

      - name: Apply Graham's sell rule to open positions
        if: steps.gate.outputs.go == 'true'
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python positions.py --in positions.csv --out positions_status.csv

      - name: Build the technical page
        if: steps.gate.outputs.go == 'true'
        run: |
          python build_tech_page.py --in tech_results.csv \
            --positions positions_status.csv --out docs/technical.html

      - name: Commit and push results
        if: ${{ steps.gate.outputs.go == 'true' && inputs.tickers == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quality_results.csv tech_results.csv positions_status.csv docs/technical.html
          if git diff --staged --quiet; then
            echo "אין שינוי, אין מה לשמור"
            exit 0
          fi
          git commit -m "Daily technical stage"
          # דחיפה עם ניסיונות חוזרים. בלי זה, commit שנוחת במאגר בזמן שהסריקה
          # רצה דוחה את הדחיפה, והתוצאה של ריצה שלמה נעלמת בלי שאיש ישים לב.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "נשמר בניסיון $attempt"
              exit 0
            fi
            echo "ניסיון $attempt נכשל, מנסה שוב"
            sleep 5
          done
          echo "לא הצלחתי לדחוף אחרי שלושה ניסיונות" >&2
          exit 1
